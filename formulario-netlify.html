<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Formulario de confirmaciones</title>
</head>
<body>
<!-- Este archivo solo sirve para que Netlify reconozca el formulario "confirmaciones".
     Los invitados nunca lo ven: confirman desde la invitación (index.html). -->
<form name="confirmaciones" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="confirmaciones">
  <input name="bot-field">
  <input type="text" name="nombre">
  <input type="text" name="asistencia">
  <input type="number" name="personas">
</form>
</body>
</html>
