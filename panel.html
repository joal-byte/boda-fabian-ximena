<title>Confirmaciones · Fabián y Ximena</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--lino:#F4F0E4;--papel:#FDFBF5;--arena:#C9A35F;--cafe:#34492A;--cafe-suave:#56654A;--linea:#E0E4D2;--si:#3B5230;--no:#A23B2A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--lino:#182014;--papel:#212A1B;--arena:#C9A35F;--cafe:#EEF0E2;--cafe-suave:#C9D1B8;--linea:#3A4630;--si:#A9CC99;--no:#F0A08A}}
:root[data-theme="dark"]{color-scheme:dark;--lino:#182014;--papel:#212A1B;--arena:#C9A35F;--cafe:#EEF0E2;--cafe-suave:#C9D1B8;--linea:#3A4630;--si:#A9CC99;--no:#F0A08A}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--lino);color:var(--cafe);font-family:"EB Garamond",Georgia,serif;font-size:19px;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:2rem 1rem 3rem}
h1{font-family:"Pinyon Script",cursive;font-weight:400;font-size:2.6rem;line-height:1.1;margin:0;text-align:center}
.estado{text-align:center;color:var(--cafe-suave);margin:.3rem 0 1.6rem}
.resumen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem;margin-bottom:2rem;text-align:center}
.resumen div{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:.9rem .4rem}
.resumen strong{display:block;font-size:2.2rem;line-height:1.1;font-weight:500}
.resumen span{font-size:.95rem;color:var(--cafe-suave)}
h2{font-size:1.3rem;font-weight:600;margin:1.6rem 0 .6rem;padding-bottom:.4rem;border-bottom:1px solid var(--arena)}
h2.si{color:var(--si)} h2.no{color:var(--no)}
ul{list-style:none;margin:0;padding:0}
li{padding:.7rem 0;border-bottom:1px solid var(--linea)}
li b{font-weight:600}
li small{color:var(--cafe-suave);font-size:.9rem}
li i{display:block;color:var(--cafe-suave)}
.vacio{color:var(--cafe-suave);font-style:italic}
button{display:block;margin:2rem auto 0;min-height:50px;padding:0 1.4rem;border-radius:999px;border:1.5px solid var(--arena);background:var(--papel);color:var(--cafe);font:inherit;font-size:1rem;cursor:pointer}
button:focus-visible{outline:3px solid var(--cafe);outline-offset:3px}
</style>

.hoja-pdf .ad{top:0;right:0;background-image:var(--esq-b);transform:scaleX(-1)}
.hoja-pdf .bi{bottom:0;left:0;background-image:var(--esq-b);transform:scaleY(-1);opacity:.85}
.hoja-pdf .bd{bottom:0;right:0;background-image:var(--esq-a);transform:scale(-1,-1);opacity:.85}
.hoja-pdf .cuerpo{position:absolute;left:80px;right:80px;top:150px;bottom:110px}
.hoja-pdf .cuerpo.primera{top:120px}
.hoja-pdf .nombres{font-family:"Pinyon Script",cursive;font-size:60px;line-height:1.1;text-align:center;margin:0}
.hoja-pdf .sub{text-align:center;margin:6px 0 0;font-size:18px;color:#56654A;font-style:italic}
.hoja-pdf .titulo{text-align:center;margin:22px 0 18px;font-size:22px;letter-spacing:.06em;color:#8A621F}
.hoja-pdf .linea{width:70px;height:1px;background:#C9A35F;margin:0 auto}
.hoja-pdf .datos{display:flex;gap:16px;justify-content:center;margin:20px 0 22px}
.hoja-pdf .datos div{min-width:190px;padding:12px 16px;text-align:center;background:rgba(255,255,255,.7);border:1px solid #DCCB9F;border-radius:14px}
.hoja-pdf .datos b{display:block;font-size:34px;font-weight:500;line-height:1.1}
.hoja-pdf .datos span{font-size:15px;color:#56654A}
.hoja-pdf table{width:100%;border-collapse:collapse;font-size:17px;background:rgba(255,255,255,.55)}
.hoja-pdf th{text-align:left;font-weight:600;padding:10px 12px;border-bottom:1.5px solid #C9A35F;color:#34492A;background:rgba(235,239,222,.85)}
.hoja-pdf td{padding:9px 12px;border-bottom:1px solid #E0E4D2}
.hoja-pdf tr:nth-child(even) td{background:rgba(255,255,255,.55)}
.hoja-pdf td.n,.hoja-pdf th.n{width:44px;text-align:center;color:#8A621F}
.hoja-pdf td.p,.hoja-pdf th.p{width:100px;text-align:center}
.hoja-pdf td.f,.hoja-pdf th.f{width:190px;color:#56654A;font-size:15px}
.hoja-pdf .pie{position:absolute;left:200px;right:200px;bottom:48px;display:flex;justify-content:center;gap:22px;font-size:13px;color:#56654A}
.hoja-pdf .vacio{text-align:center;font-style:italic;color:#56654A;padding:30px 0}
</style>
</head>
<body>
<main>
  <h1>Fabián y Ximena</h1>
  <p class="estado" id="estado">Cargando confirmaciones…</p>

  <div class="resumen">
    <div><strong id="n-personas">0</strong><span>personas van</span></div>
    <div><strong id="n-si">0</strong><span>confirmaciones</span></div>
  </div>

  <h2 class="si">Confirmados</h2>
  <ul id="lista-si"></ul>

  <button type="button" id="descargar">Descargar lista en PDF</button>
</main>
<div id="hojas" aria-hidden="true"></div>

<script>
(function(){
  var datos = [];
  var $ = function(id){ return document.getElementById(id); };
  var norm = function(t){ return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim(); };
  var fecha = new Intl.DateTimeFormat('es-CO', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });

  // Si alguien respondió dos veces, cuenta solo su última respuesta
  function unificar(rs){
    var m = {};
    rs.forEach(function(r){
      if (!r.nombre) return;
      var k = norm(r.nombre);
      if (!m[k] || new Date(r.fecha) > new Date(m[k].fecha)) m[k] = r;
    });
    return Object.keys(m).map(function(k){ return m[k]; }).sort(function(a, b){ return a.nombre.localeCompare(b.nombre, 'es'); });
  }

  function lista(ul, items, conPersonas){
    ul.textContent = '';
    if (!items.length){
      var v = document.createElement('li'); v.className = 'vacio'; v.textContent = 'Nadie todavía.'; ul.appendChild(v); return;
    }
    items.forEach(function(d){
      var li = document.createElement('li');
      var b = document.createElement('b'); b.textContent = d.nombre; li.appendChild(b);
      var s = document.createElement('small');
      s.textContent = (conPersonas ? ' · ' + d.personas + (d.personas === 1 ? ' persona' : ' personas') : '') + ' · ' + fecha.format(new Date(d.fecha));
      li.appendChild(s);
      if (d.mensaje){ var i = document.createElement('i'); i.textContent = '“' + d.mensaje + '”'; li.appendChild(i); }
      ul.appendChild(li);
    });
  }

  fetch('/.netlify/functions/confirmados')
    .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw j; return j; }); })
    .then(function(j){
      datos = unificar(j.respuestas || []);
      var si = datos.filter(function(d){ return d.asiste; });
      $('n-personas').textContent = si.reduce(function(t, d){ return t + (d.personas || 1); }, 0);
      $('n-si').textContent = si.length;
      lista($('lista-si'), si, true);
      $('estado').textContent = si.length + (si.length === 1 ? ' confirmación' : ' confirmaciones') + ' hasta ahora';
    })
    .catch(function(e){
      $('estado').textContent = e && e.error === 'config'
        ? 'Falta configurar el panel en Netlify.'
        : 'No se pudieron cargar las confirmaciones. Recarga la página.';
    });

  // ---- PDF con el diseño de la invitación ----
  function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

  function hoja(num, total, primera, filas, resumen){
    var h = el('div', 'hoja-pdf');
    ['m1','m2'].forEach(function(c){ h.appendChild(el('div', c)); });
    ['ai','ad','bi','bd'].forEach(function(c){ h.appendChild(el('div', 'esq ' + c)); });
    var c = el('div', 'cuerpo' + (primera ? ' primera' : ''));
    if (primera){
      c.appendChild(el('p', 'nombres', 'Fabián y Ximena'));
      c.appendChild(el('p', 'sub', 'Matrimonio y Bautizo de Luciana · 24 de diciembre de 2026'));
      c.appendChild(el('p', 'titulo', 'Lista de confirmados'));
      c.appendChild(el('div', 'linea'));
      var d = el('div', 'datos');
      var d1 = el('div'); d1.appendChild(el('b', null, resumen.personas)); d1.appendChild(el('span', null, 'personas asistirán'));
      var d2 = el('div'); d2.appendChild(el('b', null, resumen.confirmaciones)); d2.appendChild(el('span', null, 'confirmaciones'));
      d.appendChild(d1); d.appendChild(d2); c.appendChild(d);
    } else {
      c.appendChild(el('p', 'titulo', 'Lista de confirmados (continuación)'));
    }
    if (!filas.length){
      c.appendChild(el('p', 'vacio', 'Todavía no hay confirmaciones.'));
    } else {
      var t = el('table'), th = el('tr');
      [['n','#'],['','Nombre'],['p','Personas'],['f','Confirmó']].forEach(function(x){ th.appendChild(el('th', x[0], x[1])); });
      t.appendChild(th);
      filas.forEach(function(r){
        var tr = el('tr');
        tr.appendChild(el('td', 'n', r.i));
        tr.appendChild(el('td', '', r.nombre));
        tr.appendChild(el('td', 'p', r.personas));
        tr.appendChild(el('td', 'f', r.fecha));
        t.appendChild(tr);
      });
      c.appendChild(t);
    }
    h.appendChild(c);
    var pie = el('div', 'pie');
    pie.appendChild(el('span', null, 'Generado el ' + new Date().toLocaleString('es-CO', { day: 'numeric', month: 'long', year: 'numeric', hour: 'numeric', minute: '2-digit' })));
    pie.appendChild(el('span', null, 'Página ' + num + ' de ' + total));
    h.appendChild(pie);
    return h;
  }

  $('descargar').addEventListener('click', async function(){
    var boton = $('descargar');
    if (!window.html2canvas || !window.jspdf){ alert('No se pudo preparar el PDF. Revisa tu internet y recarga la página.'); return; }
    boton.disabled = true; boton.textContent = 'Preparando PDF…';
    try {
      var si = datos.filter(function(d){ return d.asiste; });
      var fechaCorta = new Intl.DateTimeFormat('es-CO', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
      var filas = si.map(function(d, i){ return { i: i + 1, nombre: d.nombre, personas: d.personas, fecha: fechaCorta.format(new Date(d.fecha)) }; });
      var resumen = { personas: si.reduce(function(t, d){ return t + (d.personas || 1); }, 0), confirmaciones: si.length };
      var POR_PRIMERA = 12, POR_HOJA = 17, grupos = [filas.slice(0, POR_PRIMERA)];
      for (var k = POR_PRIMERA; k < filas.length; k += POR_HOJA) grupos.push(filas.slice(k, k + POR_HOJA));

      await document.fonts.ready;
      var cont = $('hojas'); cont.textContent = '';
      var pdf = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4' });
      for (var g = 0; g < grupos.length; g++){
        var h = hoja(g + 1, grupos.length, g === 0, grupos[g], resumen);
        cont.appendChild(h);
        var canvas = await window.html2canvas(h, { scale: 2, backgroundColor: '#F5F8F3' });
        if (g > 0) pdf.addPage();
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 595.28, 841.89);
        cont.removeChild(h);
      }
      pdf.save('confirmados-fabian-ximena.pdf');
    } catch (e) {
      alert('No se pudo crear el PDF. Inténtalo de nuevo.');
    } finally {
      boton.disabled = false; boton.textContent = 'Descargar lista en PDF';
    }
  });
})();
</script>
</body>
</html>
